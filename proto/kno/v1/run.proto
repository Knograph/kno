syntax = "proto3";

package kno.v1;

import "kno/v1/common.proto";
import "kno/v1/portfolio.proto";

// Stage is which pipeline stage produced a Run.
//
// The loop is Baseline, Value, Select, Validate, Export, Bridge. Each stage
// reads what an earlier one wrote, so a Run's stage decides which artifacts
// it is allowed to produce and which it may read.
enum Stage {
  // Unset.
  STAGE_UNSPECIFIED = 0;

  // Run the agent over the evals and score it. Establishes the reference
  // every later delta is measured against.
  STAGE_BASELINE = 1;

  // Measure each Asset's marginal contribution.
  STAGE_VALUE = 2;

  // Build the Portfolio under budget.
  STAGE_SELECT = 3;

  // Run the Portfolio as a set against the untouched holdout. The only stage
  // permitted to read SPLIT_HOLDOUT Cases.
  STAGE_VALIDATE = 4;

  // Write the training set, report, and gaps.
  STAGE_EXPORT = 5;

  // Group-ablate the tuning-set behavior Assets on a proxy model: submit
  // fine-tuning jobs, host the results, and measure leave-one-group-out
  // deltas against the DEV Cases of each failure cluster.
  //
  // Not folded into STAGE_VALUE: a bridge run has its own budget dimensions
  // (training tokens, serve minutes), its own resume semantics
  // (adopt-by-suffix rather than re-submit), and its own terminal states.
  // Reusing STAGE_VALUE would make `kno value --resume` adopt tuning jobs.
  STAGE_BRIDGE = 6;
}

// RunStatus is how a Run ended, or that it has not.
//
// Declared in common.proto, not here: Portfolio carries a source run's status
// (Portfolio.source_status), and this file imports portfolio.proto — so the
// enum has to live in the file both import. Full name and numbers unchanged,
// so records written before the move decode identically.
// Run is one execution of one pipeline stage.
//
// It is the correlation key for every trace, score, and event the stage
// produced, and it carries the inputs that decide whether a later resume is
// even comparable.
message Run {
  // Stable identifier, ULID-formatted.
  string id = 1;

  // Which stage this Run executed.
  Stage stage = 2;

  // RFC 3339 start timestamp.
  string created_at = 3;

  // RFC 3339 end timestamp. Absent while the Run is still going, which is why
  // it is optional rather than an empty string that could mean either.
  optional string finished_at = 4;

  // The agent measured.
  AgentRef agent = 5;

  // The Goal optimized, and which way is better for it. Both are needed to
  // interpret the sign of anything this Run produced.
  string goal_name = 6;

  // Which way is better for that Goal. Without it the sign of every number
  // this Run produced is uninterpretable.
  Direction goal_direction = 7;

  // The caps this Run executed under.
  Budget budget = 8;

  // How it ended.
  RunStatus status = 9;

  // Why the result should not be trusted as a clean reference, when it should
  // not be. Empty on a healthy Run.
  string incomplete_reason = 10;

  // Fingerprint over all resume-relevant inputs: eval source content, goal
  // name and direction, agent ref, split_seed, and holdout_frac.
  //
  // A resume whose fingerprint differs is refused with ErrCheckpointStale,
  // because continuing would mix results computed against different inputs
  // into one Run — which looks like one measurement and is not.
  string input_fingerprint = 11;

  // Content hash of the eval source alone.
  //
  // Recorded separately because the combined fingerprint can only say
  // "something changed". Every other input is already a discrete field on this
  // message, so with this one the CLI can name exactly which input moved —
  // which is the difference between "the checkpoint does not match" and "your
  // evals file changed since this run started". CLAUDE.md's error grammar
  // requires what failed, why, and the fix; a single opaque hash can only
  // deliver the first.
  string eval_content_hash = 21;

  // Number of trials each Case was scheduled for, when the stage runs
  // repeated measurements. Recorded so a resume's fingerprint and the report
  // can state the configuration honestly; baselines recorded before this
  // field existed have it unset, and unset means "trials unknown", never a
  // refusal.
  optional int32 trials = 28;

  // The baseline run this Value run paired against. Part of the resume
  // consent: a resume against a DIFFERENT baseline would silently re-pair
  // every recorded score against a different reference, mixing two baselines
  // into one delta.
  string baseline_run_id = 30;

  // The serialized value.Plan a Value run executed under, recorded at close.
  // A resume consumes this instead of re-running routing — re-running with a
  // drifted ControlReserve, seed, or Asset set would produce measurements the
  // recorded rows cannot pair against, and comparing the requested
  // configuration against this is the fingerprint check.
  bytes value_plan = 29;

  // Optional salt for the dev/holdout split. Empty by default, and empty is
  // the right default: the split is keyed on Case ID alone so that adding
  // Cases never moves the ones already there. Changing this deliberately
  // re-splits, which is why it is part of input_fingerprint.
  string split_seed = 12;

  // Fraction of Cases assigned to the holdout, e.g. 0.2.
  double holdout_frac = 13;

  // Case counts, recorded so a reader can judge statistical weight without
  // recomputing them, and so the denominator behind every later delta is
  // visible rather than inferred.
  //
  // attempted = scored + errored. An errored Case is NOT a scored Case: the
  // agent did not answer badly, it did not answer, and counting infrastructure
  // failure as task failure would bias the baseline downward and make every
  // later Asset look better than it is.
  // Cases in the dev split — the ones this Run was allowed to read.
  int32 dev_case_count = 14;

  // Cases held back. A small holdout produces a wide interval, so this number
  // is part of reading the final result honestly.
  int32 holdout_case_count = 15;

  // Cases the Run tried to execute. For a stage that measures a Case more than
  // once, this counts MEASUREMENTS — see CaseExecution.
  int32 attempted_case_count = 16;

  // Cases that produced a Score. This is the denominator. Counts MEASUREMENTS
  // for a stage that measures a Case more than once — see attempted_case_count.
  int32 scored_case_count = 17;

  // Cases where the agent failed to answer. Excluded from the score, recorded
  // here so the exclusion is visible rather than implied. Counts MEASUREMENTS
  // on the same terms as the two above, so attempted = scored + errored holds
  // in whichever unit the stage counts.
  int32 errored_case_count = 18;

  // Cases in this run's eval set whose provenance marks them DERIVED — weak
  // labels mined from transcripts where a human corrected the agent (`kno
  // mine`), rather than expectations someone authored.
  //
  // Written at run close. Zero for an eval set with no derived Cases.
  // Recorded separately so a weak-label eval cannot pass for a hand-authored
  // one: exact-match scores over mined Cases are honest only within the
  // goal-mode declaration mine makes (judge goals generally; exact-match only
  // where resolution mode shaped the expected to a short answer), and a reader
  // can apply that caveat only when the number is on the record.
  int32 weak_label_case_count = 31;

  // Set when the holdout is too small to support a meaningful confidence
  // interval. The Run still executes; the number is reported with the caveat
  // attached rather than presented as if it meant the same thing.
  bool holdout_underpowered = 19;

  // Set when the share of errored Cases exceeded the configured threshold. A
  // Run in this state is not a baseline, and later stages must refuse to treat
  // it as a clean reference.
  bool error_rate_exceeded = 20;

  // Facts about a Run that executed Cases. Absent for a stage that does not.
  //
  // Written for every Run whose stage executes Cases, with zeros where nothing
  // ran. Absent means the stage does not execute Cases at all — Select
  // attempts none — NOT that a Case-executing run happened to score nothing.
  //
  // Value DOES execute Cases and writes this. See the message's own comment
  // for what its counts mean there.
  //
  // Presence is set by the STAGE, not derived from whether any outcome was
  // recorded. A run whose Cases were every one refused after being charged has
  // no outcomes, and deriving presence from the query would report "this stage
  // executes no Cases" about a run that executed Cases and spent money — the
  // inverted form of the exact ambiguity this message exists to remove.
  //
  // The five flat counters above carry the same numbers and are still written.
  //
  // See ADR-0004. This is the presence-carrying replacement for the five flat
  // counters above. Both stages write it now — Baseline since M2-11, Value
  // since V-4c — so the flat counters remain only for readers that predate
  // the migration and can be dropped once those are gone.
  optional CaseExecution case_execution = 22;

  // The decoding configuration this Run executed under.
  //
  // Part of what makes a baseline comparable to itself. Absent for a stage
  // that invokes no agent.
  //
  // Records the LAST process's configuration. Run.input_fingerprint does not
  // yet cover these values (M2-6), so a resume under a different ceiling is
  // currently accepted and this field cannot prove every Case ran under what
  // it reports.
  optional Generation generation = 23;

  // Which dated pricing table produced this Run's cost figures.
  //
  // Prices are a versioned table rather than a runtime lookup — a pricing
  // endpoint that is down or lying is a spend path with no ceiling. Recording
  // which version was used is what lets a report say the spend figure is
  // reported usage at a dated price, which is not the same thing as an
  // invoice.
  string pricing_table_version = 24;

  // The concurrency this Run executed at, and whether the engine chose it.
  //
  // NOT POPULATED YET. Nothing writes this before M2-10c; an absent field
  // today means "not yet recorded", NOT "this Run ran at what it asked for".
  // ADR-0004 requires that disambiguation here rather than only in the ADR,
  // because this comment is the published API reference.
  //
  // On Run rather than on CaseExecution deliberately. CaseExecution's presence
  // bit means "this Run executed Cases" (ADR-0004), and concurrency is decided
  // before any Case runs — before the Run record exists. Putting it there
  // would make a scheduling fact share a presence bit with an execution fact.
  optional ConcurrencyDecision concurrency = 25;

  // The seed behind every random choice this Run made: which Cases were
  // reserved as controls, and which were sampled.
  //
  // NOT Generation.seed, which is the provider's sampler and a different
  // thing. Recorded because a sample nobody can reproduce is a number nobody
  // can audit — and because the control partition is drawn BEFORE routing, so
  // whether a control set was outcome-independent is a claim only the seed can
  // substantiate after the fact.
  //
  // ABSENT for a Run that made no random choice.
  //
  // An OUTPUT: generated when the Run starts unless the caller supplied one,
  // and recorded so the draw can be reproduced. It is deliberately NOT part of
  // input_fingerprint — unlike split_seed, which is, because re-splitting
  // changes which Cases are holdout and a resume across that is a corrupted
  // reference. A resume under a different sampling seed is a lesser problem
  // (two samples mixed in one Run) but still one, so the resume check compares
  // it directly rather than through the fingerprint.
  optional int64 sampling_seed = 26;

  // The set of values this Goal's Score can take.
  //
  // Recorded because the interval method for any delta computed against this
  // Goal depends on it, and because a reader holding a Valuation with
  // method "tango" cannot otherwise verify which branch produced it. DECLARED
  // by the Goal, never inferred from the scores observed — inferring it is
  // method selection from the sample.
  ScoreDomain goal_score_domain = 27;
}

// ConcurrencyDecision is the width a Run executed at, and why.
//
// Written for every Run whose stage executes Cases, reduced or not. Presence
// means "this stage had a concurrency" — a fact the message can establish —
// rather than "a reduction happened", which `requested != effective` already
// says. Recording it only on reduction would leave a Run that ran at 32 and
// one that ran at 8 byte-identical, so the record could not answer whether two
// Runs are comparable.
//
// Absent for a stage that invokes no agent — Select attempts none.
//
// Value DOES have a concurrency: it injects an Asset and re-runs Cases, which
// is agent work with a width. See docs/adr/0004.
message ConcurrencyDecision {
  // What the user asked for.
  //
  // ABSENT when they did not ask and the built-in default applied — which is
  // the path almost every user takes. The distinction is load-bearing for the
  // report docs/debt.md#44 requires: telling someone "you requested 8, we gave
  // you 5" when they requested nothing trains them to distrust the message.
  optional int32 requested = 1;

  // What the Run actually used.
  int32 effective = 2;

  // Why the engine reduced it, or UNSPECIFIED when it did not.
  //
  // Also the discriminator for the two arithmetic fields below: UNSPECIFIED
  // means no cap was in play and both are zero because there was nothing to
  // measure, not because the measurement came out at zero.
  ConcurrencyReason reason = 3;

  // The cost-cap headroom at the moment of the decision, in micro-USD.
  //
  // ZERO when reason is UNSPECIFIED: no cost cap constrained the width, so
  // there was no headroom to read. `reason` is the discriminator — read it
  // before either of the two arithmetic fields below, which are terms of a
  // computation that only happens under a cap.
  //
  // Named for WHEN it was read. SpendRecorded carries a field of the same
  // shape for the LIVE remaining budget, and mixing a one-shot open-time
  // snapshot into that series would plot a lie.
  int64 headroom_usd_micros = 4;

  // What one Case was estimated to cost when the decision was made.
  //
  // ZERO when reason is UNSPECIFIED, for the same reason as the field above.
  //
  // Carried so the arithmetic is reproducible rather than asserted. The engine
  // divides a fraction of the headroom by this to get an affordable width, and
  // a consumer given only the headroom cannot check the result — they can only
  // solve for the terms they were not told.
  int64 per_case_estimate_usd_micros = 5;
}

// ConcurrencyReason names why an effective concurrency differs from what was
// requested.
//
// An enum rather than free text: this is rendered by the TUI and serialized by
// the API, and a sentence is neither. A reason nobody has enumerated arrives
// as UNSPECIFIED, which is honest — better than a string that reads like an
// explanation and cannot be branched on.
enum ConcurrencyReason {
  // No reduction was made, or the reason is one this build does not name.
  CONCURRENCY_REASON_UNSPECIFIED = 0;

  // The cost cap could not admit the requested width. Reserving N Cases at
  // once holds N pessimistic estimates against the cap, so a narrow cap and a
  // wide pool deadlock: nothing can be authorized.
  CONCURRENCY_REASON_COST_CAP = 1;
}

// CaseExecution carries the facts that only mean something for a Run that
// actually executed Cases.
//
// It exists for message presence: a stage that executes no Cases — Select
// attempts none — would otherwise write hard zeros indistinguishable from
// genuinely attempting nothing and scoring nothing. That is docs/debt.md#26.
//
// Value DOES execute Cases and writes this message, per docs/adr/0004. Its
// attempted/scored/errored counts are of MEASUREMENTS, not distinct Cases:
// Value measures one Case once per Asset, so 200 Assets over 50 Cases attempts
// 10,000 measurements over 50 Cases. Counting distinct Cases would put a
// denominator of 50 beside the spend for 10,000 calls — two numbers in one
// message describing different populations. Per-Asset denominators live on
// Valuation.n_routed.
//
// Its numbers are aggregated from PERSISTED ROWS at close, not from in-memory
// counters. Deriving a run-level figure from what is already durable is what
// makes it survive a crash and stay correct across a resume — the same move
// that repays docs/debt.md#27.
//
// Which rows depends on the stage, and this is load-bearing rather than
// incidental. Baseline aggregates its outcomes, one row per Case. Value
// measures a Case once per Asset, and the outcomes table is keyed by
// (run_id, case_id) with an idempotent writer — so 10,000 measurements over
// 50 Cases is not representable there, and a Value Run aggregates from its own
// per-(asset, case) rows instead. A stage that writes no such rows cannot
// report measurement counts, which is why the two land together.
message CaseExecution {
  // Cases in the dev split — the ones this Run was allowed to read.
  //
  // Always DISTINCT CASES, never measurements, on every stage: it describes
  // what was ingested rather than what was executed (ADR-0004). So a Value Run
  // legitimately reports dev_case_count 50 beside attempted 10,000, and the
  // two are different populations by design rather than by mistake — the
  // per-Asset denominator is Valuation.n_routed.
  int32 dev_case_count = 1;

  // Cases held back for Validate. A small holdout produces a wide interval,
  // so this is part of reading the final result honestly.
  int32 holdout_case_count = 2;

  // Cases with a terminal outcome. attempted = scored + errored, counting each
  // Case once regardless of how many times it was retried.
  int32 attempted_case_count = 3;

  // Of those, how many produced a Score. This is the denominator.
  int32 scored_case_count = 4;

  // Of those, how many terminally failed to answer. An errored Case is NOT a
  // scored Case: the agent did not answer badly, it did not answer, and
  // counting infrastructure failure as task failure biases the baseline
  // downward and makes every later Asset look better than it is.
  int32 errored_case_count = 5;

  // Cases the provider declined on policy grounds. Scored, and counted here
  // so a run that was refused rather than measured cannot pass for a clean
  // baseline.
  int32 refused_case_count = 6;

  // Cases whose answer hit the output ceiling and was cut off. Scored against
  // an incomplete answer, so a number here means Kno's own max_output_tokens
  // is depressing the score.
  int32 truncated_case_count = 7;

  // Cases whose cost is the engine's prediction rather than reported usage.
  // The spend figure is a guess to this extent, and says so.
  int32 usage_estimated_case_count = 8;

  // The distinct provider-side builds observed during this Run.
  //
  // Repeated, not scalar: with concurrency there is no "first response", and
  // during a provider rollout two workers in one Run legitimately see
  // different builds. A set makes the mixture visible where a
  // first-writer-wins scalar hides it.
  //
  // Deliberately NOT called a fingerprint: Run.input_fingerprint already means
  // "the hash whose mismatch refuses a resume". Deliberately NOT called a
  // backend either: store/ already uses that word for a Store implementation.
  repeated string observed_provider_builds = 9;

  // The models the provider reported as actually answering. More than one
  // means an alias moved mid-Run.
  repeated string resolved_models = 10;

  // How many Valuations this Run produced -- the number of comparisons the
  // intervals in it are drawn from.
  //
  // Each Valuation's interval controls a PER-COMPARISON error rate. With 200
  // Assets at a 95% level, roughly ten null ones have intervals excluding
  // zero by construction, and they concentrate where improvement-per-cost
  // ranks highest because small samples and small Assets are the same
  // Assets. A consumer cannot correct for that from the level alone.
  //
  // A floor rather than the number: where a recorded baseline is reused as
  // the control, every Asset is paired against the same draw, so their
  // errors are positively correlated and independent-comparison arithmetic
  // understates.
  optional int32 valuation_count = 11;
}
