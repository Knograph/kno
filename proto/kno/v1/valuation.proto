syntax = "proto3";

package kno.v1;

import "kno/v1/common.proto";

// Interval is a confidence interval. It is a message rather than a pair of
// scalars so that its ABSENCE is representable: a Valuation with no Interval
// means "no confidence interval was computed", which is categorically
// different from an interval of zero width.
//
// That distinction is load-bearing. No delta is reported without its interval;
// an absent one must be impossible to mistake for a tight one.
message Interval {
  // Lower bound. Meaningless when sidedness is UPPER — read `sidedness` first,
  // and write 0 rather than an infinity: protojson serializes those as the
  // strings "-Infinity"/"Infinity", which the generated OpenAPI declares as a
  // number.
  double low = 1;

  // Upper bound. Meaningless when sidedness is LOWER. MUST be written as 0
  // there, for the reason above.
  double high = 2;

  // Confidence level, e.g. 0.95.
  //
  // Its meaning depends on `sidedness`: for a TWO_SIDED interval it is the
  // probability the interval covers the true value; for a one-sided bound it
  // is the probability the true value lies on the bounded side. Reading a
  // one-sided 0.95 as a two-sided 0.95 overstates confidence.
  double level = 3;

  // How the interval was computed: "bootstrap", "t", "wilson", "tango",
  // "agresti-min", "adjusted-wald", "mover-wilson", "sign", "net-loss-shared",
  // "net-loss-indep". Recorded because the method is
  // part of the claim, and because a delta whose method changed between two
  // runs did not become more precise — it was measured differently.
  string method = 4;

  // Which sides are bounded.
  //
  // A one-sided bound written into a two-sided field is read as a two-sided
  // interval by everything downstream: RejectionReason.NO_EFFECT is defined
  // as "the interval crosses zero", the report colors deltas by whether they
  // cross zero, and both would silently accept a bound that is unbounded on
  // the side they are testing.
  Sidedness sidedness = 5;

  // How many PAIRS the interval was computed from — not observations, which
  // would be twice that for a paired design.
  //
  // Present because "the interval is wide" and "the interval is wide AND the
  // sample was tiny" call for different responses, and because a consumer
  // correcting for multiple comparisons cannot do so from `level` alone.
  optional int32 n_pairs = 6;
}

// Sidedness records which ends of an Interval are bounded.
enum Sidedness {
  // Unset. Read as TWO_SIDED.
  //
  // Not "an emitter that cannot say should not emit": every Interval written
  // before this field existed — baselines, Portfolios, Reports — decodes as
  // zero, and they are all two-sided. A zero value that condemned them would
  // make this field unreadable on exactly the records it was added to
  // describe, and renumbering later is breaking.
  SIDEDNESS_UNSPECIFIED = 0;

  // Both ends bounded. The default for a delta.
  SIDEDNESS_TWO_SIDED = 1;

  // Only `high` is meaningful: the true value is at most `high`, with
  // probability `level`. This is the shape of a harm bound — "this Asset costs
  // you no more than X" — which is a different question from "is the effect
  // distinguishable from zero" and needs a different instrument.
  SIDEDNESS_UPPER = 2;

  // Only `low` is meaningful.
  SIDEDNESS_LOWER = 3;
}

// RejectionReason is why an Asset did not make the Portfolio, or — for the
// four values that describe an absent or unmeasurable measurement — why Value
// never measured it or could not form an interval around it. Two stages share the enum because they are the same question asked at
// two depths, and splitting it would make a Rejection carrying Value's answer
// need a second field to say which enum it held.
//
// Every excluded
// Asset gets one — a rejection log with reasons is what turns "we cut your
// data" into "here is what your data did and did not do".
enum RejectionReason {
  // Unset.
  REJECTION_REASON_UNSPECIFIED = 0;

  // Measured, but the delta was indistinguishable from zero: the confidence
  // interval crosses it.
  REJECTION_REASON_NO_EFFECT = 1;

  // Measured, and it made things WORSE. The strongest possible reason to
  // exclude something, and the one users most need to see.
  REJECTION_REASON_REGRESSION = 2;

  // Near-duplicate of an Asset already selected. See
  // Rejection.redundant_with_asset_ids for which one.
  REJECTION_REASON_REDUNDANT = 3;

  // It helped, but not enough per unit cost to earn a place under the budget.
  // Another Asset bought more improvement per dollar.
  REJECTION_REASON_COST_DOMINATED = 4;

  // Real effect, wrong vehicle — e.g. a knowledge Asset proposed for the
  // tuning set, where retention is unreliable and staleness cannot be patched.
  REJECTION_REASON_WRONG_MECHANISM = 5;

  // Routing found no failure slice this Asset could plausibly affect, so it
  // was never measured. A cheap, early, genuinely useful answer.
  REJECTION_REASON_IRRELEVANT = 6;

  // The budget ran out before this Asset could be measured. Distinct from
  // every reason above: it is a statement about the run, not about the Asset,
  // and silently merging it into NO_EFFECT would be a lie.
  REJECTION_REASON_BUDGET_EXHAUSTED = 7;

  // Measurement was attempted and failed — a provider timeout, a judge error,
  // a malformed response.
  //
  // Distinct from NO_EFFECT, which is a clean negative result, and from
  // BUDGET_EXHAUSTED, which is a statement about the run. An error is not
  // something the Asset did, and reporting it as one would make the rejection
  // log dishonest in the direction that matters most: telling a user their
  // data is worthless when the truth is that Kno failed to measure it.
  REJECTION_REASON_MEASUREMENT_FAILED = 8;

  // Measurements were made but no interval could be formed around them, so no
  // delta is reported. Two causes: the sample was too small to form an
  // interval (fewer than two pairs, a one-Case routed or control slice), or
  // per-Case trial attrition left ragged vectors that no legitimate interval
  // method accepts. It is a statement about the sample, not about the Asset —
  // reporting a bare delta under it is the thing prime directive 5 exists to
  // prevent, and it must never degrade into NO_EFFECT.
  REJECTION_REASON_UNDERPOWERED = 9;
}

// Valuation is an Asset's measured record: what it did, how sure we are, what
// it costs, and how it was measured.
message Valuation {
  // The Asset measured.
  string asset_id = 1;

  // The run that produced this measurement, ULID-formatted.
  //
  // Valuations are a top-level addressable resource in the API, so they must
  // be correlatable to their run without depending on the message that
  // happens to embed them.
  string run_id = 14;

  // Change in the Goal on the slices this Asset was routed to. Sign is
  // relative to the Goal's own direction.
  double delta_goal = 2;

  // Confidence interval on delta_goal. ABSENT means not computed, which
  // happens exactly when not_measured is set — never report delta_goal
  // without checking this field is present.
  Interval delta_interval = 3;

  // Change in the Goal on untouched CONTROL slices. This is the regression
  // signal: an Asset that helps its target slice while hurting controls is a
  // net loss, and only measuring the target slice would hide that.
  double delta_control = 4;

  // Confidence interval on delta_control. ABSENT means not computed;
  // delta_control is omitted whenever this is absent.
  Interval control_interval = 5;

  // How this was measured. CONTEXT results are an upper bound, not a
  // deployment prediction, and must be reported as such.
  InjectionMode mode = 6;

  // Number of repeated trials behind these numbers.
  int32 trials = 7;

  // Case IDs this Asset was routed to and measured against. Recorded so a
  // reader can audit which slice produced the delta.
  repeated string case_ids = 8;

  // Cost of running this valuation, in MICRO-USD. The measurement's own price,
  // distinct from the Asset's carrying cost.
  int64 measurement_cost_usd_micros = 9;

  // The Asset's carrying cost, copied here so a Valuation is self-contained.
  CostVector cost = 10;

  // Improvement per unit cost — the actual ranking metric. Raw delta_goal is
  // not the ranking metric and never has been.
  //
  // Denominator: the Asset's carrying `cost.context_tokens` — the count pool
  // adapters estimate from bytes, which carries the tokenizer bias debt #68
  // names (docs/debt.md#68): the estimate reserves ~3x what English prose
  // uses, correct for reserving money, wrong for ranking. Two Assets of equal
  // real token cost can differ ~2.4x in this number by content type alone.
  // The bias is acknowledged here and in what-the-numbers-mean.md, not argued
  // away.
  //
  // Set only beside delta_goal and only when context_tokens is present and
  // positive. An absent or zero denominator leaves this field unset — never a
  // division by zero, and never a zero written as if it were measured.
  double delta_per_cost = 11;

  // Kind as judged by mechanism routing.
  Kind kind = 12;

  // Set when the valuation could not be completed. A failed measurement is
  // recorded rather than dropped; dropping failures biases the whole run.
  string error = 13;

  // Why no measurement was made, when none was.
  //
  // An Asset that routed to zero Cases costs nothing and is answered cheaply —
  // "this is irrelevant to your evals" is a valuable early result, not a
  // failure. Without this field the Value stage had nowhere to record it, and
  // the only carrier was Select's Rejection, which would hand Select's
  // rejection log to the wrong stage.
  //
  // Absent means a measurement WAS made; read it before reading delta_goal.
  //
  // Only four values are legal here — IRRELEVANT, BUDGET_EXHAUSTED,
  // MEASUREMENT_FAILED, and UNDERPOWERED — because they are the only ones
  // that describe an ABSENT or UNMEASURABLE measurement. NO_EFFECT,
  // REGRESSION, REDUNDANT, COST_DOMINATED and WRONG_MECHANISM are all
  // conclusions drawn FROM a measurement, and writing one here would say "no
  // measurement was made because the delta was indistinguishable from zero",
  // which requires the measurement it denies. UNDERPOWERED is the boundary
  // case: measurements exist, but no interval could be formed, so delta_goal
  // and delta_control are omitted alongside it.
  //
  // When this is MEASUREMENT_FAILED, `error` carries the cause; this field is
  // authoritative on whether a delta exists.
  RejectionReason not_measured = 15;

  // How many Cases this Asset was routed to, and how many were in the dev
  // split it was routed from.
  //
  // Both, because delta_goal is the mean effect over the routed Cases AND
  // NOTHING ELSE. A tagged Asset's delta is over its slice; an untagged one's
  // is over the whole split; the two are different quantities and Select ranks
  // them together on delta_per_cost anyway. These are what let a reader scale
  // one to the other, and what make the incomparability visible instead of
  // implied.
  optional int32 n_routed = 16;

  // Cases in the dev split this Asset was routed from. See n_routed.
  optional int32 n_dev = 17;

  // Set when the control arm was too small to detect the harm it is testing
  // for.
  //
  // A two-sided interval that crosses zero renders as "no regression" under
  // the report's coloring rule — identically to a genuine pass. An
  // underpowered harm test that looks like a passed one is worse than an
  // absent one, so it is marked and the marker travels with the number.
  optional bool control_underpowered = 18;

  // How many pairs the delta was computed over. n_pairs vs n_routed is the
  // attrition statement: every Case that routed but did not pair is a dropped
  // measurement, and the drop direction is biased (Cases where the Asset was
  // most harmful are exactly the ones most likely to error). A Valuation that
  // hides the shrinkage reports a mean over "whatever survived" as if it were
  // the routed mean.
  optional int32 n_pairs = 19;

  // How many pairs were dropped before the delta was computed. See n_pairs.
  optional int32 n_dropped = 20;

  // How many Cases the control arm measured.
  //
  // Present because the net-loss judgement (docs/debt.md#67) combines the
  // treatment and control deltas weighted by their POPULATIONS, and a reader
  // holding only the interval cannot recover the sample size from it. A
  // recorded-baseline control arm measures `n_control` Cases against the
  // baseline's recorded scores; a fresh control arm measures the same number
  // afresh. Without the count, the weighted combination is uncomputable from
  // the named inputs.
  optional int32 n_control = 21;

  // Whether the control arm was measured fresh rather than read from the
  // recorded baseline.
  //
  // Present because it decides the COVARIANCE of the net judgement: a
  // recorded-baseline control arm pairs every Asset's delta against the same
  // draw (docs/debt.md#66 names the correlation), while a fresh arm pairs each
  // against its own. Two Valuations with the same numbers but different arms
  // have different joint uncertainty, and the record must say which it is.
  //
  // False means the recorded baseline served as the control — valid exactly
  // where the selection did not condition on the baseline outcome.
  optional bool fresh_control_arm = 22;

  // Which pairing scheme produced every delta in this Valuation.
  //
  // The A7 recording (docs/debt.md#78, recording half): which trial routed
  // which Case is a function of this scheme. Under RECORDED_BASELINE, every
  // trial of every routed Case pairs against the single recorded baseline
  // draw — so the trials are correlated and the interval's effective pair
  // count is the Case count, not the trial count. Under FRESH_PER_TRIAL, each
  // trial pairs against the control draw taken in the same trial.
  //
  // UNSPECIFIED means the record predates the field or the emitter did not
  // name a scheme; a reader must not assume either scheme from it.
  PairingScheme pairing_scheme = 23;

// (n_comparisons lives on CaseExecution, not here: it is a run-level fact, and
  // a Valuation is written when its Asset finishes rather than when the run
  // does — so the count is unknowable at write time and every row would need
  // rewriting at close.)
}

// PairingScheme records which draw each trial of a measurement paired against.
//
// The question matters because it decides whether trials are independent
// observations. Under RECORDED_BASELINE every trial of one Case pairs against
// the same recorded score, so the trials are repeats of one comparison rather
// than draws from a distribution; under FRESH_PER_TRIAL each trial has its own
// control draw and the pairs are closer to independent.
enum PairingScheme {
  // Unset. Read as "the scheme this record does not name"; never assume either
  // scheme from it.
  PAIRING_SCHEME_UNSPECIFIED = 0;

  // Every trial paired against the same recorded baseline draw. The scheme
  // docs/debt.md#78's sample-splitting question is about replacing.
  PAIRING_SCHEME_RECORDED_BASELINE = 1;

  // Each trial paired against the fresh control draw taken in the same trial.
  PAIRING_SCHEME_FRESH_PER_TRIAL = 2;
}
