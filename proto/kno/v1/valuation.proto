syntax = "proto3";

package kno.v1;

import "kno/v1/common.proto";

// Interval is a confidence interval. It is a message rather than a pair of
// scalars so that its ABSENCE is representable: a Valuation with no Interval
// means "no confidence interval was computed", which is categorically
// different from an interval of zero width.
//
// That distinction is load-bearing. No delta is reported without its interval;
// an absent one must be impossible to mistake for a tight one.
message Interval {
  // Lower bound.
  double low = 1;

  // Upper bound.
  double high = 2;

  // Confidence level, e.g. 0.95.
  double level = 3;

  // How the interval was computed: "bootstrap", "t", "wilson". Recorded
  // because the method is part of the claim.
  string method = 4;
}

// RejectionReason is why an Asset did not make the Portfolio. Every excluded
// Asset gets one — a rejection log with reasons is what turns "we cut your
// data" into "here is what your data did and did not do".
enum RejectionReason {
  // Unset.
  REJECTION_REASON_UNSPECIFIED = 0;

  // Measured, but the delta was indistinguishable from zero: the confidence
  // interval crosses it.
  REJECTION_REASON_NO_EFFECT = 1;

  // Measured, and it made things WORSE. The strongest possible reason to
  // exclude something, and the one users most need to see.
  REJECTION_REASON_REGRESSION = 2;

  // Near-duplicate of an Asset already selected. See
  // Rejection.redundant_with_asset_ids for which one.
  REJECTION_REASON_REDUNDANT = 3;

  // It helped, but not enough per unit cost to earn a place under the budget.
  // Another Asset bought more improvement per dollar.
  REJECTION_REASON_COST_DOMINATED = 4;

  // Real effect, wrong vehicle — e.g. a knowledge Asset proposed for the
  // tuning set, where retention is unreliable and staleness cannot be patched.
  REJECTION_REASON_WRONG_MECHANISM = 5;

  // Routing found no failure slice this Asset could plausibly affect, so it
  // was never measured. A cheap, early, genuinely useful answer.
  REJECTION_REASON_IRRELEVANT = 6;

  // The budget ran out before this Asset could be measured. Distinct from
  // every reason above: it is a statement about the run, not about the Asset,
  // and silently merging it into NO_EFFECT would be a lie.
  REJECTION_REASON_BUDGET_EXHAUSTED = 7;

  // Measurement was attempted and failed — a provider timeout, a judge error,
  // a malformed response.
  //
  // Distinct from NO_EFFECT, which is a clean negative result, and from
  // BUDGET_EXHAUSTED, which is a statement about the run. An error is not
  // something the Asset did, and reporting it as one would make the rejection
  // log dishonest in the direction that matters most: telling a user their
  // data is worthless when the truth is that Kno failed to measure it.
  REJECTION_REASON_MEASUREMENT_FAILED = 8;
}

// Valuation is an Asset's measured record: what it did, how sure we are, what
// it costs, and how it was measured.
message Valuation {
  // The Asset measured.
  string asset_id = 1;

  // The run that produced this measurement, ULID-formatted.
  //
  // Valuations are a top-level addressable resource in the API, so they must
  // be correlatable to their run without depending on the message that
  // happens to embed them.
  string run_id = 14;

  // Change in the Goal on the slices this Asset was routed to. Sign is
  // relative to the Goal's own direction.
  double delta_goal = 2;

  // Confidence interval on delta_goal. ABSENT means not computed — never
  // report delta_goal without checking this field is present.
  Interval delta_interval = 3;

  // Change in the Goal on untouched CONTROL slices. This is the regression
  // signal: an Asset that helps its target slice while hurting controls is a
  // net loss, and only measuring the target slice would hide that.
  double delta_control = 4;

  // Confidence interval on delta_control.
  Interval control_interval = 5;

  // How this was measured. CONTEXT results are an upper bound, not a
  // deployment prediction, and must be reported as such.
  InjectionMode mode = 6;

  // Number of repeated trials behind these numbers.
  int32 trials = 7;

  // Case IDs this Asset was routed to and measured against. Recorded so a
  // reader can audit which slice produced the delta.
  repeated string case_ids = 8;

  // Cost of running this valuation, in MICRO-USD. The measurement's own price,
  // distinct from the Asset's carrying cost.
  int64 measurement_cost_usd_micros = 9;

  // The Asset's carrying cost, copied here so a Valuation is self-contained.
  CostVector cost = 10;

  // Improvement per unit cost — the actual ranking metric. Raw delta_goal is
  // not the ranking metric and never has been.
  double delta_per_cost = 11;

  // Kind as judged by mechanism routing.
  Kind kind = 12;

  // Set when the valuation could not be completed. A failed measurement is
  // recorded rather than dropped; dropping failures biases the whole run.
  string error = 13;
}
