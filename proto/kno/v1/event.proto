syntax = "proto3";

package kno.v1;

import "kno/v1/common.proto";
import "kno/v1/valuation.proto";
import "kno/v1/portfolio.proto";
import "kno/v1/run.proto";

// Event is one thing that happened during a Run.
//
// The event stream is the single spine: the engine emits these, the TUI
// renders them, the API streams them, and the logs record them. New
// user-visible state means a new event type, never a side channel — otherwise
// the three surfaces drift and each shows a different version of the run.
//
// EVENTS CARRY IDS AND METRICS, NEVER CONTENT. No Case input, no Response
// output, no Asset content. CLAUDE.md forbids conversation content in
// telemetry and in logs above DEBUG, and this stream feeds all three
// consumers, so content is made unrepresentable here rather than left to each
// producer to remember to omit. A live view identifies work by id, tags, and
// title — which is what those fields are for.
message Event {
  // The Run this belongs to.
  string run_id = 1;

  // RFC 3339 timestamp.
  string emitted_at = 2;

  // Monotonic per Run, starting at 1.
  //
  // A consumer that sees a gap knows it lost events, rather than silently
  // under-reporting. This matters most for a CI job parsing --json output:
  // without it, dropped events look like work that never happened.
  //
  // ACROSS RESUME: a resumed Run continues from max(sequence) already recorded
  // for that run_id, plus one. It does NOT restart at 1 — that would make
  // events from before and after the interruption collide on the same number,
  // silently defeating the gap detection this field exists for, in exactly the
  // case (a long run that got interrupted) where a consumer most needs it.
  int64 sequence = 3;

  // What happened.
  oneof payload {
    // The Run opened.
    RunStarted run_started = 10;

    // A Case produced a Score.
    CaseScored case_scored = 11;

    // A Case failed to produce one.
    CaseErrored case_errored = 12;

    // Periodic heartbeat.
    StageProgress stage_progress = 13;

    // Money was settled.
    SpendRecorded spend_recorded = 14;

    // The Run closed.
    RunFinished run_finished = 15;

    // The Run picked up where an interrupted one stopped.
    RunResumed run_resumed = 16;

    // A Case is being retried.
    RetryAttempted retry_attempted = 17;

    // The run is waiting out a provider rate limit.
    RateLimitWaiting rate_limit_waiting = 18;

    // Settled cost exceeded what was authorized for it.
    SettlementOvershoot settlement_overshoot = 19;

    // The engine chose a narrower concurrency than the run asked for.
    ConcurrencyReduced concurrency_reduced = 20;

    // Money was spent on a Case that produced no outcome.
    OrphanSpend orphan_spend = 21;

    // An Asset was routed, measured, or set aside. Value's unit of work is the
    // Asset, and every payload above is Case- or Run-scoped — so before these
    // the stage's user-visible state had nowhere to go, which CLAUDE.md
    // forbids ("new user-visible state = new event type, never a side
    // channel") and which left the TUI with nothing to render.
    AssetRouted asset_routed = 22;

    // An Asset's measurement finished, with its delta and interval.
    AssetValued asset_valued = 23;
  }
}

// EventError is a failure as it appears ON THE EVENT STREAM.
//
// Deliberately NOT Actionable. Actionable carries `cause` — the upstream error
// verbatim, never paraphrased, which is the right call for a message a user
// reads in their own terminal. But a provider rejecting an oversized or
// malformed prompt routinely echoes request content back in its error body,
// and the event stream is logged, rendered, and streamed over SSE. Reusing
// Actionable here would make the content rule depend on every provider's
// choice of error text.
//
// The code is stable and machine-readable, so a consumer can still branch on
// what happened. The verbatim cause stays in the store, where trace content
// already lives under the same handling rules, and in the terminal error the
// user sees directly.
message EventError {
  // Stable, machine-readable code, e.g. "AGENT_UNREACHABLE". Matches
  // Actionable.code so a consumer can correlate the two.
  string code = 1;

  // What failed, in one sentence, written by Kno rather than echoed from a
  // provider.
  string message = 2;

  // Process exit code this failure would produce.
  int32 exit_code = 3;
}

// RunStarted opens a Run. Always sequence 1.
message RunStarted {
  // Which stage is starting.
  Stage stage = 1;

  // The agent being measured.
  AgentRef agent = 2;

  // The Goal, and which way is better for it.
  string goal_name = 3;

  // Which way is better for it. A renderer needs this to color a delta
  // honestly rather than assuming higher is good.
  Direction goal_direction = 4;

  // Total Cases this Run intends to attempt, so a consumer can render
  // progress. Zero when the source cannot report a count without consuming it
  // — a streaming source must not be drained just to draw a progress bar.
  int32 total_cases = 5;

  // The caps this Run will execute under.
  Budget budget = 6;

  // The set of values this Goal's Score can take.
  //
  // Recorded because the interval method for any delta computed against this
  // Goal depends on it, and because a reader holding a Valuation with
  // method "tango" cannot otherwise verify which branch produced it. DECLARED
  // by the Goal, never inferred from the scores observed — inferring it is
  // method selection from the sample.
  ScoreDomain goal_score_domain = 7;
}

// CaseScored reports one Case that produced a Score.
message CaseScored {
  // The Case. An identifier, never its input.
  string case_id = 1;

  // The score value. Interpret its sign against the Run's goal_direction.
  double score = 2;

  // Whether it counted as a pass, for Goals with a threshold.
  bool passed = 3;

  // What this Case cost, in micro-USD.
  int64 cost_usd_micros = 4;

  // Wall-clock latency of the agent call.
  int64 latency_ms = 5;

  // Which Asset was injected, when the stage injects one.
  //
  // EMPTY for Baseline, which measures a Case once. Value measures the same
  // Case once per Asset, so without this a consumer sees the same case_id
  // arrive N times with different scores and no way to tell which measurement
  // is which — and the event stream is the spine the TUI and the API both
  // render from.
  string asset_id = 6;
}

// CaseErrored reports one Case the agent failed to answer.
//
// Deliberately a separate payload from CaseScored rather than a CaseScored
// with an error field. An errored Case is not a scored Case, and the live view
// and the persisted result must agree about the sample — if a consumer counted
// errors as scores, its denominator would differ from the Report's, and every
// delta computed from either would be measured against a different population.
message CaseErrored {
  // The Case that failed.
  string case_id = 1;

  // What went wrong. EventError rather than Actionable: see EventError.
  EventError error = 2;

  // Whether the executor will retry this Case.
  //
  // COUNTING RULE: only a CaseErrored with will_retry = false is TERMINAL and
  // counts toward errored. A retried Case contributes exactly one outcome to
  // the totals — whichever terminal event it ends on — so a Case that fails
  // twice and then succeeds counts as one scored Case and zero errored ones.
  //
  // Without this rule, a Case retried twice would add 2 to errored and 1 to
  // scored, putting one Case on both sides of the very distinction these two
  // payloads exist to preserve, and inflating attempted past the real Case
  // count.
  //
  // Spend is counted differently and deliberately: every attempt takes its own
  // budget reservation and settles its own cost, so a retried Case contributes
  // its failed attempts' cost too. One outcome, several charges.
  bool will_retry = 3;

  // What the failed attempt still cost. Often zero when the provider rejected
  // the call outright, but not always.
  int64 cost_usd_micros = 4;

  // Which Asset was injected, when the stage injects one.
  //
  // EMPTY for Baseline, which measures a Case once. Value measures the same
  // Case once per Asset, so without this a consumer sees the same case_id
  // arrive N times with different scores and no way to tell which measurement
  // is which — and the event stream is the spine the TUI and the API both
  // render from.
  string asset_id = 5;
}

// StageProgress is a periodic heartbeat.
//
// Emitted on an interval rather than per Case, so a 1M-Case run does not
// produce 1M progress events on top of its 1M outcome events.
message StageProgress {
  // Which stage is running.
  Stage stage = 1;

  // Work items with a TERMINAL outcome so far. attempted = scored + errored; an
  // item still being retried is not yet counted. See CaseErrored.will_retry.
  //
  // The UNIT is the stage's unit of work: Cases for Baseline, MEASUREMENTS for
  // Value, which measures a Case once per Asset. total_cases below is in the
  // same unit, so the ratio is a progress fraction on every stage rather than
  // reaching 20,000% on the one that measures a Case 200 times.
  int32 attempted = 2;

  // Of those, how many produced a Score.
  int32 scored = 3;

  // Of those, how many terminally failed to answer.
  int32 errored = 4;

  // Total work items intended, in the same unit as attempted above, matching
  // RunStarted.total_cases. Zero when unknown.
  int32 total_cases = 5;

  // Throughput, for the ETA a dashboard shows.
  //
  // Averaged over THIS PROCESS's work and THIS PROCESS's clock.
  //
  // Not over the last interval: a rate measured across one heartbeat swings
  // wildly when a single Case takes longer than it, which for an LLM call is
  // most of them. And not over the whole run: attempted below spans a resume
  // while the clock starts when this process does, so a resume carrying 900
  // completed Cases into a one-second-old process would report 900 a second.
  //
  // The counts above DO span the whole run — they pair with total_cases.
  double cases_per_second = 6;
}

// SpendRecorded reports settled spend.
//
// Emitted as money is actually spent, not as it is estimated, so a dashboard's
// spend meter cannot run ahead of reality and alarm a user about money that
// was never charged.
message SpendRecorded {
  // Cumulative settled spend for the Run.
  int64 total_cost_usd_micros = 1;

  // Cumulative provider calls.
  int64 total_calls = 2;

  // Cumulative tokens, reported but never capped.
  int64 total_tokens = 3;

  // Remaining headroom against the caps, counting outstanding reservations as
  // already consumed. Absent when the Run is uncapped.
  optional int64 remaining_cost_usd_micros = 4;

  // Remaining provider calls before the cap. Absent when uncapped.
  optional int64 remaining_calls = 5;
}

// RunFinished closes a Run. Always the last event.
message RunFinished {
  // How it ended.
  RunStatus status = 1;

  // Why the result should not be trusted as a clean reference, if it should
  // not be.
  string incomplete_reason = 2;

  // Final counts. attempted = scored + errored.
  // Cases with a terminal outcome. attempted = scored + errored, counting each
  // Case once regardless of how many times it was retried.
  int32 attempted = 3;

  // Of those, how many produced a Score. This is the denominator behind
  // aggregate_score.
  int32 scored = 4;

  // Of those, how many terminally failed to answer. Excluded from
  // aggregate_score.
  int32 errored = 5;

  // The aggregate score over SCORED Cases only.
  //
  // Optional because a Run that scored nothing has no mean, and a zero here
  // would be indistinguishable from a genuine mean of zero — the same
  // distinction Interval exists to preserve elsewhere in this schema.
  optional double aggregate_score = 6;

  // Total settled spend.
  int64 total_cost_usd_micros = 7;

  // The failure, when status is RUN_STATUS_FAILED. EventError rather than
  // Actionable: see EventError.
  EventError error = 8;
}

// RunResumed reports that a Run continued from a checkpoint.
//
// Without this, a resumed Run emits a second RunStarted carrying the ORIGINAL
// total, so any live view that resets progress on RunStarted visibly jumps
// backward on every resume. A consumer replaying full history reconstructs
// correctly either way; one watching live does not. That is docs/debt.md#29.
message RunResumed {
  // Cases already recorded before this process started.
  //
  // Two coordinate systems, and mixing them is the misrender this message
  // exists to prevent. OVERALL progress runs already_completed..total_cases.
  // SESSION progress runs 0..remaining. Do not pair a numerator from one with
  // a denominator from the other: 28 done of 40, resumed, is "28 of 40"
  // overall or "0 of 12" this session — never "28 of 12".
  int32 already_completed = 1;

  // Cases left to attempt. The denominator for SESSION progress only.
  int32 remaining = 2;

  // Total Cases the Run intends to attempt across all of its lives, so a
  // consumer can render both "12 of 40 this session" and "40 of 40 overall".
  int32 total_cases = 3;

  // Spend reconstructed from disk and restored to the guard.
  //
  // Carried because a resumed Run that believed it had spent nothing could
  // consume its cap a second time, and a consumer should be able to see that
  // it did not.
  int64 restored_cost_usd_micros = 4;

  // Calls likewise.
  int64 restored_calls = 5;
}

// RetryAttempted reports one retried attempt at a Case.
//
// Emitted rather than logged because a retry is user-visible state: a run that
// appears frozen is usually a run backing off, and a user with no signal
// assumes it hung.
//
// Every attempt takes its own budget reservation and settles its own call, so
// a retry is not free and is not hidden from the caps.
message RetryAttempted {
  // Which Case.
  string case_id = 1;

  // Which attempt this is, 1-based. The first attempt does not emit.
  int32 attempt_ordinal = 2;

  // Why the previous attempt failed.
  //
  // An enum, not a string. The previous draft took a string and asserted in a
  // comment that it would never carry provider text — an assertion nothing
  // enforced. The natural implementation of an emitter is
  // `ReasonCode: err.Error()`, and a provider 400 that echoes an oversized
  // prompt would then land in the events table, in --json, in SSE, and in log
  // lines. No gate catches that: not the schema shape test, not gitleaks, not
  // lint. This message is fourteen lines away from EventError, which exists
  // for exactly this reason.
  RetryReason reason = 3;

  // How long before this attempt was made.
  int64 backoff_ms = 4;

  // What remains of the Case's retry budget. Retry is bounded by time as well
  // as by attempts: a pure time bound lets one Case consume dozens of calls
  // against a call cap, and a pure attempt bound gives a 1.5-second window
  // against provider rate limits measured in minutes.
  int64 retry_budget_remaining_ms = 5;
}

// RateLimitWaiting reports that the run is deliberately idle.
//
// This is the difference between "hung" and "obeying Retry-After". Emitted for
// both the provider's own signal and the client-side limiter, because from the
// user's side they look identical and only one of them is the provider's fault.
message RateLimitWaiting {
  // How long the wait is expected to last.
  int64 wait_ms = 1;

  // Set when the provider asked for this wait, via Retry-After. Unset means
  // the client-side limiter chose it.
  bool provider_requested = 2;

  // The host being waited on, as `host` or `host:port` — NEVER a full URL.
  //
  // Rate limits are per-host, and a run against two providers should say which
  // one is throttling. A URL would carry a path, a query, and potentially
  // userinfo onto a stream that is persisted and logged.
  string host = 3;
}

// SettlementOvershoot reports that a call cost more than was authorized.
//
// Observability, not enforcement: by settlement the money is spent, and the
// guard already refuses every subsequent authorization once spend reaches the
// cap. What this exists for is that Guard.Remaining clamps at zero, so a cap
// that has been exceeded is otherwise indistinguishable from one exactly
// consumed.
//
// A cap of C bounds spend at C + the sum of under-predictions across the calls
// in flight when it binds. This event is how that sum stops being invisible.
message SettlementOvershoot {
  // Which Case.
  string case_id = 1;

  // What was authorized, in MICRO-USD.
  int64 reserved_usd_micros = 2;

  // What it actually cost.
  int64 settled_usd_micros = 3;

  // Cumulative spend beyond the cap, or zero while still within it.
  int64 cumulative_overshoot_usd_micros = 4;

  // How much of the cumulative overshoot THIS settlement contributed.
  //
  // Not derivable from the fields above. Subtracting reserved from settled
  // over-counts by whatever headroom was left under the cap: reserved 50k,
  // settled 500k, cap 200k gives 450k where the contribution is 300k, because
  // the first 200k was still inside the cap. Summing that across events
  // inflates the total, which is why the engine carries the figure it already
  // computes rather than leaving a consumer to derive a wrong one.
  int64 delta_usd_micros = 5;
}

// OrphanSpend reports money spent on a Case that produced no outcome.
//
// A Case whose earlier attempts were charged and which was then refused by the
// budget, or interrupted mid-backoff, has no outcome to hang its cost on. The
// engine records the amount against the RUN so a resume cannot spend it twice,
// and that record cannot say which Case it belonged to.
//
// This event is the only place that attribution exists. Without it the amount
// is a bare integer on the run and nothing describes it — which is the side
// channel CLAUDE.md's Observability section forbids, and is what
// docs/debt.md#52 records.
//
// A consumer summing these gets the run's unattributed spend; the same total
// appears inside SpendRecorded, which does not separate it.
message OrphanSpend {
  // Which Case the money was spent on.
  string case_id = 1;

  // What the provider charged across the attempts that were made, in
  // MICRO-USD.
  int64 cost_usd_micros = 2;

  // How many provider calls the guard settled for it.
  int64 calls = 3;

  // Why the Case never produced an outcome.
  OrphanReason reason = 4;
}

// OrphanReason names why a Case was abandoned after being charged.
enum OrphanReason {
  // Unset. An emitter that cannot say why should not be emitting this.
  ORPHAN_REASON_UNSPECIFIED = 0;

  // The cost or call cap could not admit another attempt. The run is stopping
  // resumably and this Case will be re-attempted.
  ORPHAN_REASON_BUDGET_EXCEEDED = 1;

  // The run was cancelled — a Ctrl-C, a deadline — while the Case was waiting
  // out a retry backoff.
  ORPHAN_REASON_CANCELLED = 2;

  // A condition that cannot change within this run ended it: a rejected
  // credential, the provider's own spend cap, a refused destination, an unpaid
  // account, a model that does not exist.
  //
  // Distinct from BUDGET_EXCEEDED even though both stop a run early, because
  // the two need opposite responses. A budget stop is resumable as-is — raise
  // the cap or accept the partial result. A run-fatal stop is not: resuming
  // without fixing the condition makes the same request and gets the same
  // answer, having paid for the attempt. Reporting one as the other tells the
  // user to raise a cap that was never the problem.
  ORPHAN_REASON_RUN_FATAL = 3;
}

// ConcurrencyReduced reports that the engine narrowed the run's concurrency.
//
// NOT EMITTED YET. Nothing sends this before M2-10c.
//
// Emitted once, at the start, for a reduction only — a run that got the width
// it asked for has no news. Run.concurrency records the decision either way,
// and the two answer the same question at different times: this answers "why
// is this slow" while it is happening, the field answers it afterwards from a
// record, for someone who was not watching.
//
// docs/debt.md#44: the reduction is silent — no event, no log line, no field —
// and a 6x slowdown the user did not ask for is user-visible state, which
// CLAUDE.md says is a new event type and never a side channel.
message ConcurrencyReduced {
  // The decision, in the same shape the Run records.
  //
  // Embedded rather than restated field by field. Two near-copies of one fact
  // drift: they gain different names for the same number, and a field added to
  // one is forgotten on the other. Exact duplication cannot.
  ConcurrencyDecision decision = 1;
}

// RetryReason is why an attempt is being retried.
//
// Closed set, deliberately. Only transient conditions belong here: a permanent
// failure must not be retried, because every attempt takes its own budget
// reservation and settles its own call against the caps.
enum RetryReason {
  // Unset. An emitter that cannot classify must not retry.
  RETRY_REASON_UNSPECIFIED = 0;

  // The provider asked us to slow down.
  RETRY_REASON_RATE_LIMITED = 1;

  // A transport-level failure with no evidence the provider processed the
  // request — a stale pooled connection, a reset before any bytes were
  // written.
  RETRY_REASON_TRANSPORT_TRANSIENT = 2;

  // The provider returned a 5xx.
  RETRY_REASON_PROVIDER_UNAVAILABLE = 3;

  // The request timed out before a response began.
  RETRY_REASON_TIMEOUT = 4;
}

// AssetRouted reports which Cases an Asset will be measured against, and how
// many it will actually cost.
//
// Emitted BEFORE any measurement, so a watcher sees the shape of the work
// before the money is spent — and so an Asset that routes to nothing is
// visible as a decision rather than as silence.
message AssetRouted {
  // Which Asset.
  string asset_id = 1;

  // Cases this Asset could plausibly affect.
  int32 n_routed = 2;

  // Cases actually drawn from those, after sampling.
  int32 n_sampled = 3;

  // Control Cases drawn from the reserved partition.
  int32 n_control = 4;

  // Set when the Asset routed to nothing and will not be measured. The
  // interesting case is IRRELEVANT, which costs nothing and is a real answer.
  RejectionReason not_measured = 5;

  // How many times each measurement is repeated.
  //
  // Present because the cost of this Asset is
  // (n_sampled x arms + n_control) x trials, and an event whose stated job is
  // showing the shape of the work before the money is spent would understate
  // by exactly this multiplier without it — which is the omission the Value
  // plan records making twice.
  int32 trials = 7;

  // Whether the control arm is measured fresh rather than read from the
  // baseline.
  //
  // True when routing conditioned on the baseline outcome, because reusing the
  // draw that SELECTED a Case as that Case's control manufactures the effect
  // being measured. Recorded per Asset because it changes both the cost and
  // what the delta is an estimate of.
  bool fresh_control_arm = 6;
}

// AssetValued reports a finished Valuation.
//
// The Valuation itself is the durable record; this is the event a dashboard
// renders as it happens. It carries the identity and the headline numbers, not
// a copy of the whole message — an event stream that duplicates the store is
// two things to keep consistent.
message AssetValued {
  // Which Asset.
  string asset_id = 1;

  // The measured effect and its interval. Both, always: a delta without its
  // interval is the thing prime directive 5 exists to prevent, and an event
  // is exactly where that discipline slips.
  double delta_goal = 2;

  // The interval on delta_goal. Never omitted: a delta without its interval is
  // the thing prime directive 5 exists to prevent.
  Interval delta_interval = 3;

  // Improvement per unit cost — the ranking metric.
  double delta_per_cost = 4;

  // What this measurement cost, in MICRO-USD.
  int64 measurement_cost_usd_micros = 5;

  // Set when the valuation could not be completed.
  RejectionReason not_measured = 6;
}
