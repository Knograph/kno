syntax = "proto3";

package kno.v1;

import "kno/v1/common.proto";
import "kno/v1/valuation.proto";

// PortfolioEntry is one selected Asset and the measurement that earned it a
// place.
message PortfolioEntry {
  // The selected Asset.
  string asset_id = 1;

  // Where it goes.
  Destination destination = 2;

  // The measurement behind the decision.
  Valuation valuation = 3;

  // Selection order. Portfolio construction is greedy on delta-per-cost, so
  // rank is informative about marginal contribution, not just a row number.
  int32 rank = 4;

  // The scaling factor applied to this entry's tagged delta to make it
  // comparable to an untagged one, under the model docs/debt.md#65 names:
  // the effect is uniform on the routed slice and zero elsewhere, so a tagged
  // delta over n_routed of n_dev Cases scales by n_routed / n_dev.
  //
  // ABSENT means the delta was not scaled — either the Valuation was untagged
  // (already an effect over the whole dev split) or n_routed was absent (the
  // scale would be a silent division, and the entry is flagged instead of
  // scaled). Presence of this field is the flag: a reader can tell a scaled
  // entry from an unscaled one without re-deriving the factor.
  optional double n_routed_scale = 5;

  // SHA-256 of the Asset's content at selection time.
  //
  // Validate re-reads the Pool and refuses an Asset whose content no longer
  // matches. Without it, a Pool edited between `select` and `validate`
  // produces a holdout number for a set that is not the set the report names,
  // undetectably — and Asset carries no content hash of its own.
  //
  // ABSENT for a Portfolio written before this field existed, or by a Select
  // run that had no Pool. Absence disables the check rather than failing it:
  // an older Portfolio is not evidence of tampering.
  optional bytes content_hash = 6;
}

// RedundancyEvidenceKind is which instrument decided one redundancy
// comparison.
enum RedundancyEvidenceKind {
  // Unset.
  REDUNDANCY_EVIDENCE_KIND_UNSPECIFIED = 0;

  // Decided by measured per-Case deltas: equivalence (Condition 1) and
  // co-located incidence (Condition 2), both against the shared routed
  // slice. Kind-agnostic and scoped within destination.
  REDUNDANCY_EVIDENCE_KIND_MEASUREMENT = 1;

  // Decided by 3-gram shingle overlap on content, at the shipped 0.6
  // threshold. Knowledge-kind only, destination-blind, for byte-compatibility
  // with the rule this replaces where measurement evidence is unavailable.
  REDUNDANCY_EVIDENCE_KIND_CONTENT_SHINGLE = 2;
}

// RedundancyDecidedBy is which criterion broke the tie between two Assets
// this plan's Condition 1 found measurement-equivalent.
enum RedundancyDecidedBy {
  // Unset — the pair was not decided by a tie-break (e.g. content evidence).
  REDUNDANCY_DECIDED_BY_UNSPECIFIED = 0;

  // The cheaper Asset's carrying cost survived; the two costs differed by
  // more than the docs/debt.md#68 bias band (2.4x), so the estimate could
  // support the claim.
  REDUNDANCY_DECIDED_BY_COST = 1;

  // Asset ID, ascending. Used when costs are equal or inside the bias band —
  // the estimate cannot tell the two apart, so the tie falls to a
  // deterministic, unbiased rule instead.
  REDUNDANCY_DECIDED_BY_ID = 2;

  // Decided by content evidence rather than a measurement tie-break.
  REDUNDANCY_DECIDED_BY_CONTENT = 3;
}

// CoImprovementFloorSource records which term produced Condition 2's
// co-improvement floor: the data's own chance level, or a stricter floor the
// user supplied.
enum CoImprovementFloorSource {
  CO_IMPROVEMENT_FLOOR_SOURCE_UNSPECIFIED = 0;
  CO_IMPROVEMENT_FLOOR_SOURCE_CHANCE = 1;
  CO_IMPROVEMENT_FLOOR_SOURCE_USER = 2;
}

// MarginSource records which term produced Condition 1's equivalence margin
// (delta): the sample's own resolution, or a stricter margin the user
// supplied. Symmetric to CoImprovementFloorSource.
enum MarginSource {
  MARGIN_SOURCE_UNSPECIFIED = 0;
  MARGIN_SOURCE_SAMPLE_RESOLUTION = 1;
  MARGIN_SOURCE_USER = 2;
}

// RedundancyEvidence is one pairwise redundancy comparison and the numbers
// behind its verdict — what a user needs to check a REDUNDANT claim they
// disagree with, per the redundancy-detection plan.
//
// Redundancy is inferred, never asserted: this message names the instrument
// (kind), the shared evidence (n_overlap, paired_difference,
// difference_interval), the margin and floor with which TERM produced them,
// and — when the pair was measurement-equivalent — which criterion broke the
// tie between the two Assets.
message RedundancyEvidence {
  // The other Asset in this comparison.
  string with_asset_id = 1;

  // Which instrument decided this comparison.
  RedundancyEvidenceKind kind = 2;

  // |C|: the shared routed slice (measurement) or n/a for content evidence.
  int32 n_overlap = 3;

  // Mean of d_with(c) - d_this(c) over the shared slice — Condition 1's
  // paired difference. Measurement evidence only.
  double paired_difference = 4;

  // Condition 1's TOST instrument: the corrected two-sided interval on
  // paired_difference. A REDUNDANT verdict requires this to lie entirely
  // inside +/- margin.
  Interval difference_interval = 5;

  // Condition 1's equivalence margin (delta).
  double margin = 6;

  // Which term produced margin.
  MarginSource margin_source = 7;

  // Condition 2's co-improvement Jaccard J = |I_A n I_B| / |I_A u I_B| over
  // the shared slice.
  double co_improvement = 8;

  // Bootstrap interval on co_improvement.
  Interval co_improvement_interval = 9;

  // Condition 2's floor: max(user floor, J_chance). A REDUNDANT verdict
  // requires co_improvement_interval's lower bound to exceed this.
  double co_improvement_floor = 10;

  // Which term produced co_improvement_floor.
  CoImprovementFloorSource co_improvement_floor_source = 11;

  // Jaccard overlap of 3-gram shingles. Recorded whenever a Pool was
  // supplied, even when measurement evidence decided — so a disagreement
  // between the two signals is visible rather than silently dropped.
  double shingle_overlap = 12;

  // The survivor's carrying cost divided by the rejected Asset's, for a
  // measurement-equivalent pair. Makes decided_by = ID on an equivalent pair
  // with different costs auditable as "inside the bias band", not a bug.
  double cost_ratio = 13;

  // Which criterion broke the tie between two measurement-equivalent Assets.
  RedundancyDecidedBy decided_by = 14;
}

// Rejection is one excluded Asset and why.
//
// The reason is an enum PLUS references, because DESIGN.md's Select stage
// requires parametrized reasons: "redundant_with:<id>" is not expressible by a
// bare enum, and a rejection log that cannot say WHICH Asset something
// duplicated is not actionable.
message Rejection {
  // The excluded Asset.
  string asset_id = 1;

  // Why it was excluded.
  RejectionReason reason = 2;

  // Set when reason is REJECTION_REASON_REDUNDANT: the already-selected Assets
  // this one duplicates.
  repeated string redundant_with_asset_ids = 3;

  // Human-readable elaboration for the report, e.g. "delta 0.004, CI
  // [-0.011, 0.019] crosses zero".
  string detail = 4;

  // The measurement, when one was taken. Absent for
  // REJECTION_REASON_IRRELEVANT and REJECTION_REASON_BUDGET_EXHAUSTED, where
  // no measurement happened — and the absence is itself the honest answer.
  Valuation valuation = 5;

  // The evidence behind a REJECTION_REASON_REDUNDANT verdict: one entry per
  // Asset named in redundant_with_asset_ids. What a user checks a claim
  // against — see the redundancy-detection plan's "way to actually check it".
  repeated RedundancyEvidence redundancy_evidence = 6;
}

// Portfolio is the selected subset of Assets, chosen under budget, with the
// rejection log that justifies every exclusion.
//
// "Include nothing new" is a legal, first-class outcome: an empty selected
// list with a full rejection log is a complete, useful answer.
message Portfolio {
  // The run that produced this.
  string run_id = 1;

  // Selected Assets, in selection order.
  repeated PortfolioEntry selected = 2;

  // Every excluded Asset, with its reason. Never truncated — the rejection log
  // is a deliverable, not diagnostics.
  repeated Rejection rejected = 3;

  // Budget constraints this Portfolio was built under.
  Budget budget = 4;

  // Total carrying cost of the selected set.
  CostVector total_cost = 5;

  // Aggregate gain from the selected set as measured on the DEV slice.
  //
  // Named for what it is rather than for what a reader might hope it is: this
  // is a selection-time estimate, inflated by the winner's curse, because the
  // Assets in it were chosen partly for winning on this very slice. It is NOT
  // a result. The honest number is Report.holdout_gain, produced by Validate
  // against the untouched slice.
  //
  // An SDK user reaching for this field by autocomplete right after `select`
  // should be stopped by its name, not only by this comment.
  double dev_estimated_gain = 6;

  // Confidence interval on dev_estimated_gain.
  Interval dev_estimated_interval = 7;

  // The Value run this Portfolio was built from.
  string source_run_id = 8;

  // How that run ended. Carried here because "built from a run that was
  // budget-stopped" is a different statement from "built from a completed
  // run": the source's incompleteness travels with the Portfolio either way,
  // so a reader does not have to go look.
  RunStatus source_status = 9;

  // The source run's incomplete_reason, verbatim, when it had one.
  string source_incomplete_reason = 10;

  // How many pairwise redundancy tests this run actually performed —
  // greedy compares each candidate only against already-selected Assets, so
  // this is bounded by k(k-1)/2 but is normally far fewer. Every
  // RedundancyEvidence.difference_interval and .co_improvement_interval is
  // corrected for this count, not for n_screened: the redundancy tests are a
  // different family from the keep/reject tests, counted separately per the
  // redundancy-detection plan.
  int32 n_redundancy_tests = 11;
}

// GapStatus is the per-cluster improvement verdict Export computes and the
// report renders.
enum GapStatus {
  // Unknown until Export says otherwise: no Asset routed to enough of the
  // cluster's Cases, or no covering measurement was usable. The output is a
  // spend recommendation, so non-significance is not absence — a cluster
  // with no coverage reports UNKNOWN, never GAP.
  GAP_STATUS_UNSPECIFIED = 0;
  GAP_STATUS_IMPROVED = 1;
  GAP_STATUS_UNKNOWN = 2;
  GAP_STATUS_GAP = 3;
}

// GapCluster is the gaps verdict for one failure cluster of the source Value
// run.
message GapCluster {
  // The cluster's normalized tag.
  string tag = 1;

  // How many failed dev Cases the cluster held at planning time.
  int32 case_count = 2;

  // How many of those the verdict's covering Asset was routed to. Set even
  // when the verdict is UNKNOWN for lack of a usable measurement: a record
  // with covered_count set and no best_asset_id is "routed but
  // underpowered", distinct from "nothing routed to the minimum" (zero).
  int32 covered_count = 3;

  // The verdict.
  GapStatus status = 4;

  // The Asset the verdict was computed from: the covering Asset with the
  // strongest measured delta. Empty when nothing covered the cluster
  // (status UNKNOWN for want of coverage).
  string best_asset_id = 5;

  // The reported number: the best covering Asset's delta and its 95%
  // interval. One cluster, one number, never a cluster-level threshold game.
  double best_delta = 6;
  // The 95% confidence interval on best_delta. Excluding zero is what
  // IMPROVED means.
  Interval best_interval = 7;
}

// Gaps is the persisted gaps record for one Export run, keyed by the run that
// produced it.
//
// ABSENT means the run recorded none: the source Value run predates the
// Clusters field, so there is no cluster data to report — the report says so
// rather than guessing.
message Gaps {
  // The Export run that computed this.
  string run_id = 1;

  // One verdict per failure cluster, in the source plan's tag order.
  repeated GapCluster clusters = 2;

  // Whether multiple testing is in play: verdicts are per-cluster, so a
  // run with several clusters multiplies the chance of a false positive.
  // True when more than one cluster was evaluated. Labeled, never hidden.
  bool multiple_testing = 3;
}

// Budget is the constraint set a Portfolio was built under.
message Budget {
  // Maximum tokens the selected context may add per call.
  int64 max_context_tokens = 1;

  // Maximum examples in a tuning set.
  int64 max_training_examples = 2;

  // Maximum bytes written to the knowledge base.
  //
  // DESTINATION_KNOWLEDGE_BASE costs storage and retrieval rather than
  // per-call tokens, so neither of the caps above bounds it. Without this,
  // knowledge_base is the one destination a user cannot put a ceiling on.
  int64 max_knowledge_base_bytes = 6;

  // Maximum spend for the run, in MICRO-USD.
  int64 max_cost_usd_micros = 3;

  // Maximum LLM calls for the run. A hard ceiling independent of dollars,
  // because rate limits and time are also budgets.
  int64 max_llm_calls = 4;

  // Repeated trials per measurement. Fewer trials is cheaper and widens every
  // confidence interval — the tradeoff is explicit rather than hidden.
  int32 trials = 5;
}
