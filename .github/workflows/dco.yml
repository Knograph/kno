name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $sha is missing 'Signed-off-by: $author'"
              failed=1
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$failed" -ne 0 ]; then
            echo "Sign off with: git commit -s   (or fix history: git rebase --signoff $BASE)"
            echo "See CONTRIBUTING.md — we use the DCO, not a CLA."
            exit 1
          fi
          echo "all commits signed off"
