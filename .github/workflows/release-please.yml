name: Release Please

on:
  push:
    branches: [main]
  # Manually triggerable. This workflow failed on three consecutive pushes to
  # main for a reason unrelated to any commit (an org policy blocking Actions
  # from opening pull requests), and with no dispatch trigger the only way to
  # retest the fix was to re-run a historical job.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Maintains a release PR from Conventional Commits: CHANGELOG entries and
      # the SemVer bump are derived, never hand-edited. Merging that PR tags the
      # release. Without this workflow, CHANGELOG.md's claim that entries are
      # "derived by release-please" would be false.
      # SHA-pinned, not @v5. This action is about to be handed
      # RELEASE_PLEASE_TOKEN — a credential that can push to main and create
      # tags, which per the release workflow is the credential that mints
      # signed releases. A mutable tag on the highest-privilege consumer in the
      # repository is the one place docs/debt.md#14 cannot wait for its own
      # trigger.
      #
      # docs/debt.md#82: when this SHA is next upgraded, the pinned version's
      # inputs must be re-checked for a `signoff` mechanism — v5 ignores the
      # input, so release PR commits ship without a DCO trailer and are signed
      # by hand today. The upgrade PR either re-adds the input or keeps the
      # manual amend in the release runbook; a bump that silently drops the
      # obligation is the failure that entry exists to prevent.
      #
      # docs/debt.md#19, recorded here because release-please-config.json
      # cannot carry comments: the bump policy below the config's keys —
      # bump-minor-pre-major + bump-patch-for-minor-pre-major — is a DECISION,
      # re-affirmed at the v0.1 release (2026-08-29), not a default. `feat:`
      # bumps the patch and breaking changes bump the minor, so reaching 1.0
      # requires a human choice. Changing either key without changing this
      # comment is the silent-reversal this entry exists to prevent.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Merging the release PR pushes the tag that release.yml waits for —
          # but GitHub does not create workflow runs from events triggered by
          # the default GITHUB_TOKEN. Tagged with that token, the release
          # workflow starts NOTHING: no run, no failure, no notification.
          #
          # RELEASE_PLEASE_TOKEN is a PAT or GitHub App token with contents:
          # write. When it exists, the tag push carries a non-Actions identity
          # and release.yml fires on its own. When it does not, this falls back
          # to the default token and a maintainer must dispatch release.yml by
          # hand against the tag. Tracked as docs/debt.md#74.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          # The DCO gate applies to every commit, including this action's.
          #
          # Not an exemption, which is what dco.yml grants dependabot and which
          # is defensible there only because a dependency bump contains no
          # authored code. A release commit contains none either — it is a
          # CHANGELOG section and a manifest bump, both DERIVED from commits
          # that were each already signed off — so the certification the DCO
          # asks for is genuinely satisfied by the commits it summarizes, and
          # recording that with a trailer is more honest than carving out
          # another `if` in the check.
          #
          # With RELEASE_PLEASE_TOKEN present the commit is authored by the
          # token's owner rather than by github-actions[bot], and dco.yml
          # matches the trailer against the author — so this value has to be
          # that identity, not a bot's.
          # The pinned action version (SHA 45996ed) does NOT accept a
          # `signoff` input — the run logs the warning "Unexpected input(s)
          # 'signoff'" and the commit ships without a trailer. The amend step
          # below adds it, so the manual step docs/debt.md#82 described is no
          # longer part of the release runbook.

      # docs/debt.md#82's standing half, repaid: the trailer is added here
      # instead of by a maintainer, on every release, forever.
      #
      # Why an amend rather than an exemption in dco.yml: with
      # RELEASE_PLEASE_TOKEN present the release commit is authored by the
      # token's OWNER, not by a bot, so there is no bot login for dco.yml's
      # dependabot-style `if` to match — and a branch-name exemption would be
      # a hole anyone could push through. Amending makes the commit genuinely
      # signed off, so the check keeps enforcing for everyone and nothing is
      # carved out. The certification is honest: a release commit is a
      # CHANGELOG section and a manifest bump DERIVED from commits that were
      # each already signed off.
      #
      # The push must carry RELEASE_PLEASE_TOKEN. A push made with the default
      # GITHUB_TOKEN creates no workflow runs, so the DCO check would never
      # re-run and the PR would sit red holding a commit that is now green.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Sign off the release commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The action may have created nothing (no releasable commits), or
          # updated an existing PR. Either way the question is the same: is
          # there an open release PR whose head commit lacks its trailer.
          branch="$(gh pr list --repo "$REPO" --state open \
            --json headRefName,title \
            --jq '[.[] | select(.title | startswith("chore(main): release"))][0].headRefName // empty')"
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to sign off"
            exit 0
          fi

          git fetch --quiet origin "$branch"
          git checkout --quiet -B signoff-amend "origin/$branch"

          # Match dco.yml's own rule: the trailer may name the author or the
          # committer, and trailing whitespace is stripped before comparing.
          author="$(git show -s --format='%an <%ae>' HEAD)"
          if git show -s --format='%B' HEAD | tr -d '\r' | sed 's/[[:space:]]*$//' \
               | grep -qxiF "Signed-off-by: $author"; then
            echo "release commit already carries its trailer; nothing to do"
            exit 0
          fi

          # Amend as the commit's own author so the trailer, the author, and
          # the committer are one identity — dco.yml matches on author OR
          # committer, and leaving them different would pass for the wrong
          # reason.
          git config user.name "$(git show -s --format='%an' HEAD)"
          git config user.email "$(git show -s --format='%ae' HEAD)"
          git commit --quiet --amend --no-edit --signoff

          # --force-with-lease: if release-please updated the branch between
          # the fetch and the push, refuse rather than clobber its work. The
          # next run picks it up.
          git push --quiet --force-with-lease origin "signoff-amend:$branch"
          echo "signed off $branch"
