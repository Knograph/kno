name: Release

on:
  push:
    tags: ["v*"]
  # The escape hatch, and it is not optional decoration.
  #
  # release-please pushes the tag using the default GITHUB_TOKEN, and GitHub
  # does not create workflow runs from events triggered by that token. So a tag
  # pushed by the release bot starts NOTHING here — no run, no failure, no
  # notification, just a release page with no artifacts on it. The durable fix
  # is a PAT or GitHub App token on release-please (see release-please.yml and
  # docs/debt.md#74); until that secret exists, a maintainer runs this workflow
  # by hand against the tag. Select the tag under "Use workflow from".
  workflow_dispatch:

# Two tag pushes must never build the same release twice, and a release must
# never be cancelled halfway: cancel-in-progress is deliberately absent, because
# an interrupted run can leave a release holding signed artifacts for only some
# of the six platforms.
concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: build, sign, attest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Scoped to this job rather than to the workflow. Workflow-level permissions
    # are inherited by every job added later, and `id-token: write` is not a
    # permission to hand out by default: it mints an identity that can sign
    # artifacts as this repository, permanently, into a public transparency log.
    #
    #   contents: write      — create the release and upload assets
    #   id-token: write      — mint the OIDC token cosign exchanges for a Fulcio
    #                          certificate. This is what "keyless" means: no
    #                          private key exists, so there is no key material
    #                          to leak, and nothing in this file is a secret.
    #   attestations: write  — record the SLSA build provenance
    #
    # Notably absent: packages: (no registry), pull-requests: (nothing is
    # opened), and any provider credential at all. This workflow spends no money
    # and talks to no LLM API, so there is nothing here for a log line to leak.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version and the changelog range from tags, so
          # a shallow clone makes it report the wrong version — or refuse.
          fetch-depth: 0

      # workflow_dispatch can be pointed at a branch. A "release" built from a
      # branch would be signed with a certificate naming refs/heads/..., which
      # every published verification command rejects — so it would produce
      # artifacts that look official and verify as nothing. Refuse early.
      - name: Refuse to release anything that is not a tag
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/v*) echo "releasing ${GITHUB_REF_NAME}" ;;
            *) echo "::error::${GITHUB_REF} is not a v* tag; refusing to release."; exit 1 ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/goreleaser/go.sum

      # cosign signs checksums.txt keylessly against the OIDC token this job's
      # id-token permission mints.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft produces the per-archive SPDX SBOMs that .goreleaser.yaml's `sboms`
      # block invokes. goreleaser shells out to it by name, so it must be on
      # PATH before `make release` runs, not after.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # One target, one goreleaser byte-pinned by tools/goreleaser/go.sum — the
      # same one `make release-check` validated on every PR that touched the
      # config. The target itself refuses to run outside GitHub Actions, so this
      # is the only path in the repository that can publish.
      - name: Build, sign and publish
        env:
          # The only secret in this workflow, and it is the one GitHub issues
          # for this run. Passed through the environment, never onto a command
          # line, where `ps` and the job log would both see it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release

      # SLSA build provenance over every artifact named in the checksum file.
      #
      # subject-checksums rather than a glob of dist/ on purpose: it makes the
      # attested set and the released set the same set by construction. A glob
      # can drift from what was actually published — attesting an artifact that
      # never shipped, or worse, shipping one that was never attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The release is a draft until here. This step appends the checksums to
      # the notes — CLAUDE.md § Security asks for "checksums in release notes",
      # and a link to an attached file is not that — and then makes it public.
      #
      # Publishing LAST is the point: every earlier failure leaves a draft
      # nobody can mistake for a finished release, rather than a public page
      # with half its artifacts.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          # The existing body first: release-please wrote it from Conventional
          # Commits, and it may have been hand-edited for the highlights.
          gh release view "$TAG" --json body --jq .body > "$notes"
          {
            printf '\n### Checksums (SHA-256)\n\n```\n'
            cat dist/checksums.txt
            printf '```\n'
          } >> "$notes"
          gh release edit "$TAG" --notes-file "$notes" --draft=false
          echo "published $TAG"
