name: Commit conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Squash-merge makes the PR TITLE the commit message, so the title is
      # what release-please parses. A malformed title silently drops the change
      # from the changelog and from the version calculation.
      - name: Validate title
        env:
          # Never interpolate untrusted PR fields directly into a shell command.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|perf|refactor|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'feat(core): add portfolio selection' — see CONTRIBUTING.md."
            exit 1
          fi
          echo "title OK"
