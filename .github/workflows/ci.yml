name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the previous run; main runs always finish so the
# proto and coverage baselines stay accurate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Read by the Makefile: turns any "tool missing" warning into a hard failure,
  # so an absent binary can never silently disable a gate here. This is the
  # actual mechanism — not a grep over stdout, which would fire on any tool
  # banner that happened to contain the word SKIP.
  KNO_CI: "1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # buf breaking --against '.git#branch=main' needs real history, and
          # the coverage ratchet compares against the committed baseline.
          fetch-depth: 0

      - name: Fetch main for the proto breaking-change baseline
        # A PR is checked out as a detached merge ref. buf breaking compares
        # against main, so main must actually exist locally — otherwise the
        # single most covenant-critical gate errors instead of running.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Cache tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          # Keyed on go.mod as well as tools/go.sum, because go.mod carries the
          # `toolchain` directive that decides which compiler actually builds
          # these binaries. Keying on setup-go's version instead was wrong: it
          # reported 1.25.8 while the toolchain directive built them with
          # 1.25.10, so the key did not describe its own contents and a
          # toolchain bump would have restored stale binaries.
          key: ${{ runner.os }}-knotools-${{ hashFiles('go.mod', 'tools/go.sum') }}

      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/kno-gitleaks
          key: ${{ runner.os }}-gitleaks-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks (pinned, checksum-verified)
        # One pinned version on both matrix legs. An unpinned `brew install` on
        # macOS would run a different scanner with a different rule set, so a
        # leak could be caught on one OS and missed on the other.
        #
        # The checksum is verified on download AND on cache restore: a cached
        # binary is still an executable placed on PATH, and trusting it just
        # because it came from a cache would defeat the point of pinning.
        run: |
          set -euo pipefail
          cache="$HOME/.cache/kno-gitleaks"
          mkdir -p "$cache"

          case "${{ runner.os }}" in
            Linux) asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            macOS) asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" ;;
            *) echo "::error::unsupported runner"; exit 1 ;;
          esac
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          if [ ! -f "$cache/$asset" ] || [ ! -f "$cache/$sums" ]; then
            curl -sSfL -o "$cache/$asset" "$base/$asset"
            curl -sSfL -o "$cache/$sums" "$base/$sums"
          fi

          ( cd "$cache" && grep " $asset\$" "$sums" | shasum -a 256 -c - )
          sudo tar -xzf "$cache/$asset" -C /usr/local/bin gitleaks
          gitleaks version

      - run: make tools

      # make check is the whole PR gate: fmt, lint, test (incl. fixture
      # integration), proto, generate-check, vuln, docs, fuzz, bench tripwire.
      # KNO_CI makes any skipped gate a hard failure.
      - run: make check

  release-please-config:
    name: release-please config is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Manifest and config parse
        run: |
          set -euo pipefail
          jq -e . release-please-config.json > /dev/null
          jq -e . .release-please-manifest.json > /dev/null
          echo "release-please config OK"

  # The release config decides what a tag produces, and a tag is the worst
  # possible place to discover it is malformed: by then the release PR is merged
  # and the tag exists. So it is validated on every PR instead.
  #
  # `make release-check` is schema validation. `make release-stamp` is the one
  # that matters: it BUILDS a binary and reads its --version back, because an
  # -X path naming the wrong package or variable fails silently and ships a
  # release that reports "dev" forever. Schema validation cannot see that.
  #
  # A separate job rather than a step inside `make check`: goreleaser is a
  # ~500-package compile on a cold cache, which does not belong in a gate whose
  # design is fail-fast-cheapest-first. The cost is that a green local
  # `make check` no longer implies green CI for changes to these files —
  # recorded as docs/debt.md#72. The release-please-config job sets the
  # precedent for validating outside `make check`.
  #
  # Actions here are pinned to commit SHAs (docs/debt.md#14). The rest of this
  # file is still on mutable tags; new code does not add to that pile.
  release-config:
    name: release config builds and stamps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # tools/goreleaser/go.sum is what makes the goreleaser compile
          # cacheable across runs. Without it the cache key never mentions the
          # module that dominates this job's build time.
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/goreleaser/go.sum
      - run: make release-check
      - run: make release-stamp
