version: 2
updates:
  # The shipping module. Every new dependency needs justification in the PR
  # body per CONTRIBUTING.md, so keep this surface small and visible.
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels: ["dependencies"]

  # Build tools are isolated from the shipping module deliberately (see
  # docs/adr/0002-generated-code-layout.md), so they update independently and
  # never appear in the product's dependency graph.
  - package-ecosystem: gomod
    directory: "/tools"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels: ["dependencies", "tooling"]
    groups:
      build-tools:
        patterns: ["*"]

  # The release tool, in its own module so its ~500-package graph cannot bump
  # the dependencies of the lint gate. Its binary runs in the one job holding
  # id-token: write, which is the strongest reason in this repo to keep a
  # dependency graph current.
  #
  # Not grouped: a single grouped bump of this graph is unreviewable, and the
  # things worth reading — cosign, sigstore, go-git — are exactly what a group
  # would bury. Note the ceiling in tools/goreleaser/go.mod: goreleaser v2.14+
  # needs Go 1.26, so a major bump PR will fail until the toolchain moves.
  - package-ecosystem: gomod
    directory: "/tools/goreleaser"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: scope
    labels: ["dependencies", "tooling", "release"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "build"
    labels: ["dependencies", "ci"]
